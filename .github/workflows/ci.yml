name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧 run 被新 push 取代时直接取消，省 runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 不写 version：package.json 的 packageManager 字段是唯一版本来源，
      # 两处都写会触发 "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build
